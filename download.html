<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Reports</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e8edf5, #dfe6f2);
        margin: 0;
        padding: 15px;
      }
      .card {
        background: white;
        max-width: 500px;
        margin: auto;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }
      h3 {
        text-align: center;
        color: #0d1b66;
      }
      label {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        color: #333;
      }
      input,
      button {
        width: 100%;
        padding: 12px;
        margin: 6px 0;
        border-radius: 8px;
        border: 1px solid #d7dce5;
        font-size: 14px;
      }
      button {
        background: #0d1b66;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #1c2e96;
      }
      #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #0d1b66;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        opacity: 0;
        transition: 0.3s;
      }
      #toast.show {
        opacity: 1;
      }

      .All {
        color: white;
        background-color: #0628e7;
      }

      .All:hover {
        background-color: #0628e7;
      }

      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        visibility: hidden;
        opacity: 0;
        transition: 0.3s;
      }

      .loader.show {
        visibility: visible;
        opacity: 1;
      }

      .loader-box {
        text-align: center;
        width: 80%;
        max-width: 300px;
      }

      .spinner {
        border: 4px solid #eee;
        border-top: 4px solid #0d1b66;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin: auto;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: #eee;
        border-radius: 5px;
        margin-top: 15px;
        overflow: hidden;
      }

      #progressFill {
        width: 0%;
        height: 100%;
        background: #0d1b66;
        transition: width 0.4s ease;
      }

      .back-res {
        background-color: #d31005;
      }

      .back-res:hover {
        background-color: #d31005;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Download School Reports</h3>
      <p id="examNotice" style="text-align:center;font-size:12px;color:#555;margin:-6px 0 14px;">
        Downloading for: <b id="examNoticeLabel"></b>
      </p>

      <label>From Date:</label>
      <input type="date" id="fromDate" />

      <label>To Date:</label>
      <input type="date" id="toDate" />
      <button onclick="downloadReport('dates')">Download Report</button>
      <button class="All" onclick="downloadReport('all')">
        Download All Time
      </button>

      <button class="back-res" id="backBtn">Back to Registration</button>

      <script>
        document.getElementById("backBtn").addEventListener("click", () => {
          // Optional: keep token in localStorage
          window.location.href = "index.html"; // Redirect without logging out
        });
      </script>
    </div>

    <div id="loader" class="loader">
      <div class="loader-box">
        <div class="spinner"></div>
        <h4 id="loaderText">Preparing report...</h4>
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
     
      const EXAMS = {
        OCT: {
          label: "October Mock (Beta)",
          apiUrl: "https://script.google.com/macros/s/AKfycbyl1OJhZSEfk96nsFrqZ-WjGVhb8ZIWjVggr-wiIamoQ_Bt8WQUSF12zw9NxNL6uJPFmw/exec"
        },
        SEPT: {
          label: "September Mock (Alpha)",
          apiUrl: "https://script.google.com/macros/s/AKfycbyPRyb0tKH18K5CsPDlpYl1reuEGsEYTHcyeAebugtjTquvCDuKMAjbdRFkBxKtut5Y1g/exec"
        }
      };

      function currentExam(){
        const e = localStorage.getItem("activeExam");
        return EXAMS[e] ? e : "OCT";
      }

      const activeExamCfg = EXAMS[currentExam()];
      const API_URL = activeExamCfg.apiUrl;

      document.getElementById("examNoticeLabel").textContent = activeExamCfg.label;

      if(activeExamCfg.apiUrl.indexOf("PASTE_") === 0){
        document.getElementById("examNotice").innerHTML =
          "This exam's backend isn't configured yet — contact admin.";
        document.getElementById("examNotice").style.color = "#cc0000";
        document.getElementById("examNotice").style.fontWeight = "700";
      }

      function showToast(msg) {
        let t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      // DOWNLOAD REPORT SCRIPT

      function downloadReport(type) {
        let from = null;
        let to = null;

        if (type !== "all") {
          from = document.getElementById("fromDate").value;
          to = document.getElementById("toDate").value;

          if (!from || !to) {
            showToast("Select both dates");
            return;
          }
        }

        let token = localStorage.getItem("token");
        if (!token) {
          showToast("Session expired");
          return;
        }

        // Loader
        const loader = document.getElementById("loader");
        const text = document.getElementById("loaderText");
        const bar = document.getElementById("progressFill");

        loader.classList.add("show");

        let progress = 0;

        const interval = setInterval(() => {
          if (progress < 90) {
            progress += Math.random() * 10;
            bar.style.width = progress + "%";

            if (progress > 30) text.innerText = "Fetching data...";
            if (progress > 60) text.innerText = "Generating PDF...";
          }
        }, 400);

      fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "download",
            token,
            from,
            to,
          }),
        })
          .then((res) => res.json())
          .then((res) => {
            clearInterval(interval);

            if (res.status === "success") {
              bar.style.width = "100%";
              text.innerText = "Downloading...";

              setTimeout(() => {
                loader.classList.remove("show");

                
                const byteCharacters = atob(res.pdfBase64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                  byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: "application/pdf" });
                const blobUrl = URL.createObjectURL(blob);

                const examTag = currentExam(); // "OCT" or "SEPT"
                const filename = res.filename
                  ? res.filename.replace(/\.pdf$/i, "") + "_" + examTag + ".pdf"
                  : "Report_" + examTag + ".pdf";

                const a = document.createElement("a");
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

                showToast("Report downloaded");
              }, 400);
            } else {
              loader.classList.remove("show");

              if (res.status === "no_data") {
                showToast("No data found");
              } else {
                showToast("Error generating report");
              }
            }
          })
          .catch(() => {
            clearInterval(interval);
            loader.classList.remove("show");
            showToast("Network error");
          });
      }
    </script>
  </body>
</html>
