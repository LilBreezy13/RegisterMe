<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Download Reports</title>
    <style>
      :root {
        --navy: #0d1b66; --navy2: #1c2e96; --ink: #1b2233; --muted: #6b7385;
        --canvas: #f3f5fb; --line: #e1e6f0; --tint: #eef1fb;
        --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { width: 100%; overflow-x: hidden; }
      html { background: var(--canvas); -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--canvas); color: var(--ink); line-height: 1.4;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      :focus-visible { outline: 3px solid rgba(13, 27, 102, 0.35); outline-offset: 2px; }

      /* top bar */
      .bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line);
        padding: var(--sat) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
      }
      .bar-in { height: 56px; max-width: 500px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
      .back {
        flex: none; width: 44px; height: 44px; display: grid; place-items: center; margin: 0; padding: 0;
        border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--navy); cursor: pointer;
      }
      .back:active { background: var(--tint); }
      .back svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .ttl { font-size: 17px; font-weight: 800; color: var(--navy); }

      .wrap {
        max-width: 500px; margin: 0 auto;
        padding: calc(56px + var(--sat) + 20px) max(16px, env(safe-area-inset-right)) calc(32px + var(--sab)) max(16px, env(safe-area-inset-left));
      }
      .pg-title { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -0.2px; }
      .pg-sub { margin: 6px 0 16px; font-size: 14px; color: var(--muted); }
      .card {
        background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px;
        box-shadow: 0 1px 2px rgba(20, 30, 70, 0.04), 0 8px 24px rgba(20, 30, 70, 0.05);
      }
      #examNotice {
        display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 18px; padding: 13px 14px;
        background: var(--tint); border: 1px solid #dfe3f5; border-radius: 12px; font-size: 14px; color: #3a4460;
      }
      #examNotice b { color: var(--navy); text-align: right; }

      .field { margin-bottom: 16px; }
      .fl { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5d6580; }
      /* date inputs: iOS otherwise renders them wider than the card */
      input[type="date"] {
        display: block; width: 100%; min-width: 0; max-width: 100%; height: 50px; margin: 0; padding: 0 14px;
        border: 1px solid #d6dbe8; border-radius: 12px; background: #fff; color: var(--ink);
        font: inherit; font-size: 16px; text-align: left; -webkit-appearance: none; appearance: none;
      }
      input[type="date"]::-webkit-date-and-time-value { text-align: left; }
      input[type="date"]:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(13, 27, 102, 0.12); }

      .btn {
        display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin: 0; padding: 0 16px;
        border: 1px solid transparent; border-radius: 12px; background: var(--navy); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .btn:active { transform: scale(0.99); background: var(--navy2); }
      .btn-ghost { background: #fff; color: var(--navy); border-color: #cfd6ea; }
      .btn-ghost:active { background: var(--tint); }
      @media (hover: hover) {
        .btn:hover { background: var(--navy2); }
        .btn-ghost:hover { background: var(--tint); }
      }
      .actions { display: grid; gap: 10px; margin-top: 20px; }

      #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #0d1b66;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        opacity: 0;
        transition: 0.3s;
      }
      #toast.show {
        opacity: 1;
      }

      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        visibility: hidden;
        opacity: 0;
        transition: 0.3s;
      }

      .loader.show {
        visibility: visible;
        opacity: 1;
      }

      .loader-box {
        text-align: center;
        width: 80%;
        max-width: 300px;
      }

      .spinner {
        border: 4px solid #eee;
        border-top: 4px solid #0d1b66;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin: auto;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: #eee;
        border-radius: 5px;
        margin-top: 15px;
        overflow: hidden;
      }

      #progressFill {
        width: 0%;
        height: 100%;
        background: #0d1b66;
        transition: width 0.4s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="bar-in">
        <button class="back" id="backBtn" type="button" aria-label="Back to registration">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <div class="ttl">Download report</div>
      </div>
    </header>

    <main class="wrap">
      <h1 class="pg-title">School reports</h1>
      <p class="pg-sub">Pick a date range, or download everything.</p>

      <div class="card">
        <p id="examNotice">
          <span>Downloading for</span> <b id="examNoticeLabel"></b>
        </p>

        <div class="field">
          <label class="fl" for="fromDate">From</label>
          <input type="date" id="fromDate" />
        </div>

        <div class="field">
          <label class="fl" for="toDate">To</label>
          <input type="date" id="toDate" />
        </div>

        <div class="actions">
          <button class="btn" onclick="downloadReport('dates')">Download report</button>
          <button class="btn btn-ghost" onclick="downloadReport('all')">Download all time</button>
        </div>
      </div>
    </main>

    <div id="loader" class="loader">
      <div class="loader-box">
        <div class="spinner"></div>
        <h4 id="loaderText">Preparing report...</h4>
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      // Back = the real browser back (so the phone's back stack never loops).
      // The flag tells the registration page to restore the signed-in screen.
      document.getElementById("backBtn").addEventListener("click", () => {
        sessionStorage.setItem("bb_return", "1");
        let same = false;
        try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
        if (same && history.length > 1) history.back();
        else location.replace("index.html");
      });
    </script>

    <script>
     
      const EXAMS = {
        OCT: {
          label: "October Mock (Beta)",
          apiUrl: "https://script.google.com/macros/s/AKfycbyl1OJhZSEfk96nsFrqZ-WjGVhb8ZIWjVggr-wiIamoQ_Bt8WQUSF12zw9NxNL6uJPFmw/exec"
        },
        SEPT: {
          label: "September Mock (Alpha)",
          apiUrl: "https://script.google.com/macros/s/AKfycbyPRyb0tKH18K5CsPDlpYl1reuEGsEYTHcyeAebugtjTquvCDuKMAjbdRFkBxKtut5Y1g/exec"
        }
      };

      function currentExam(){
        const e = localStorage.getItem("activeExam");
        return EXAMS[e] ? e : "OCT";
      }

      const activeExamCfg = EXAMS[currentExam()];
      const API_URL = activeExamCfg.apiUrl;

      document.getElementById("examNoticeLabel").textContent = activeExamCfg.label;

      if(activeExamCfg.apiUrl.indexOf("PASTE_") === 0){
        document.getElementById("examNotice").innerHTML =
          "This exam's backend isn't configured yet — contact admin.";
        document.getElementById("examNotice").style.color = "#cc0000";
        document.getElementById("examNotice").style.fontWeight = "700";
      }

      function showToast(msg) {
        let t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      // DOWNLOAD REPORT SCRIPT

      function downloadReport(type) {
        let from = null;
        let to = null;

        if (type !== "all") {
          from = document.getElementById("fromDate").value;
          to = document.getElementById("toDate").value;

          if (!from || !to) {
            showToast("Select both dates");
            return;
          }
        }

        let token = localStorage.getItem("token");
        if (!token) {
          showToast("Session expired");
          return;
        }

        // Loader
        const loader = document.getElementById("loader");
        const text = document.getElementById("loaderText");
        const bar = document.getElementById("progressFill");

        loader.classList.add("show");

        let progress = 0;

        const interval = setInterval(() => {
          if (progress < 90) {
            progress += Math.random() * 10;
            bar.style.width = progress + "%";

            if (progress > 30) text.innerText = "Fetching data...";
            if (progress > 60) text.innerText = "Generating PDF...";
          }
        }, 400);

      fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "download",
            token,
            from,
            to,
          }),
        })
          .then((res) => res.json())
          .then((res) => {
            clearInterval(interval);

            if (res.status === "success") {
              bar.style.width = "100%";
              text.innerText = "Downloading...";

              setTimeout(() => {
                loader.classList.remove("show");

                
                const byteCharacters = atob(res.pdfBase64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                  byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: "application/pdf" });
                const blobUrl = URL.createObjectURL(blob);

                const examTag = currentExam(); // "OCT" or "SEPT"
                const filename = res.filename
                  ? res.filename.replace(/\.pdf$/i, "") + "_" + examTag + ".pdf"
                  : "Report_" + examTag + ".pdf";

                const a = document.createElement("a");
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

                showToast("Report downloaded");
              }, 400);
            } else {
              loader.classList.remove("show");

              if (res.status === "no_data") {
                showToast("No data found");
              } else {
                showToast("Error generating report");
              }
            }
          })
          .catch(() => {
            clearInterval(interval);
            loader.classList.remove("show");
            showToast("Network error");
          });
      }
    </script>
  </body>
</html>
